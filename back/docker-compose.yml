services:
  postgres:
    image: postgres:17
    container_name: vocabify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vocabify
      POSTGRES_USER: vocabify
      POSTGRES_PASSWORD: vocabify
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vocabify-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
