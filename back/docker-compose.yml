services:
  postgres:
    image: postgres:17
    container_name: vocabify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vocabify
      POSTGRES_USER: vocabify
      POSTGRES_PASSWORD: vocabify
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vocabify-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: vocabify-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — open http://localhost:8025 to view emails

volumes:
  pgdata:
