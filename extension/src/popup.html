<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vocabify Capture</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">Vocabify</span>
        <h1>Capture a word</h1>
      </header>

      <section id="connect-view" hidden>
        <p>Connect with a capture token to save words to your lists.</p>
        <label for="api-url">API URL</label>
        <input id="api-url" type="url" value="http://localhost:3006/" autocomplete="url">
        <label for="web-url">Vocabify app URL</label>
        <input id="web-url" type="url" value="http://localhost:3000/" autocomplete="url">
        <label for="token">Capture token</label>
        <input id="token" type="password" autocomplete="off" placeholder="vocab_…">
        <button id="connect" type="button">Connect</button>
        <a id="manage-link" target="_blank" rel="noreferrer">Create or revoke a token in Vocabify</a>
      </section>

      <section id="capture-view" hidden>
        <p id="account" class="account"></p>
        <label for="list-id">Destination list</label>
        <select id="list-id"></select>
        <label for="term">Word</label>
        <input id="term" type="text" maxlength="200" placeholder="e.g. sobremesa">
        <label for="definition">Definition <span class="optional">optional</span></label>
        <textarea id="definition" rows="3" maxlength="2000" placeholder="Meaning or translation"></textarea>
        <label for="sentence">Sentence <span class="optional">optional</span></label>
        <textarea id="sentence" rows="3" maxlength="4000" placeholder="Sentence containing the word"></textarea>
        <label for="source-url">Source URL <span class="optional">optional</span></label>
        <input id="source-url" type="url" maxlength="2048">
        <button id="save-word" type="button">Save word</button>
        <button id="disconnect" class="secondary" type="button">Disconnect</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
